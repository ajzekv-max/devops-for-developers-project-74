services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: azkvns/devops-for-developers-project-74
    pull_policy: build
    working_dir: /app
    command: make test
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
